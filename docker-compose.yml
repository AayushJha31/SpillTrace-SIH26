services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: spilltrace-backend
    working_dir: /workspace/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql://spilltrace:spilltrace_local_password@db:5432/spilltrace
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgis/postgis:16-3.4
    container_name: spilltrace-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: spilltrace
      POSTGRES_USER: spilltrace
      POSTGRES_PASSWORD: spilltrace_local_password
    ports:
      - "5432:5432"
    volumes:
      - spilltrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    image: node:20-alpine
    container_name: spilltrace-frontend
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/workspace
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  spilltrace_pgdata: