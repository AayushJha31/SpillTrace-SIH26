services:
  db:
    image: postgis/postgis:16-3.4
    container_name: spilltrace-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: spilltrace
      POSTGRES_USER: spilltrace
      POSTGRES_PASSWORD: spilltrace_local_password

    ports:
      - "5432:5432"

    volumes:
      - spilltrace_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  spilltrace_pgdata: