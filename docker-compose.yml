version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    container_name: spilltrace-backend
    working_dir: /workspace/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql://spilltrace:spilltrace@db:5432/spilltrace
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: spilltrace-db
    environment:
      POSTGRES_DB: spilltrace
      POSTGRES_USER: spilltrace
      POSTGRES_PASSWORD: spilltrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    image: node:20-alpine
    container_name: spilltrace-frontend
    working_dir: /workspace/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: